<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birthday Surprise 🎂</title>
  <style>
    :root {
      --primary: #1546a0;
      --secondary: #8cc8ff;
      --accent: #ffd66b;
      --pink: #ff9eb5;
      --green: #7ed6a6;
      --bg: #f5f9ff;
      --text: #183153;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, #dcecff 0, transparent 34%),
        radial-gradient(circle at bottom right, #fff0c7 0, transparent 34%),
        var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    .card {
      width: min(720px, 95vw);
      padding: 54px 44px;
      border-radius: 30px;
      background: rgba(255,255,255,.97);
      box-shadow: 0 24px 65px rgba(21,70,160,.18);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .eyebrow {
      display: inline-block;
      padding: 9px 16px;
      border-radius: 999px;
      background: #e9f2ff;
      color: var(--primary);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    .cake {
      font-size: 64px;
      animation: float 2.8s ease-in-out infinite;
    }

    h1 {
      margin: 10px 0 0;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1;
      color: var(--primary);
      letter-spacing: -.04em;
    }

    .date {
      margin-top: 14px;
      font-size: 18px;
      font-weight: 700;
      color: #55718f;
    }

    .message {
      max-width: 560px;
      margin: 28px auto 0;
      font-size: 20px;
      line-height: 1.6;
      color: #49647f;
    }

    .from {
      margin-top: 34px;
      color: #6c8094;
      font-size: 16px;
    }

    .from strong {
      color: var(--text);
    }

    button {
      margin-top: 28px;
      padding: 14px 24px;
      border: 0;
      border-radius: 999px;
      background: var(--primary);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(21,70,160,.2);
    }

    .bubble {
      position: absolute;
      border-radius: 50%;
      opacity: .65;
      pointer-events: none;
    }

    .b1 { width: 90px; height: 90px; background: var(--secondary); left: -30px; top: 40px; }
    .b2 { width: 58px; height: 58px; background: var(--accent); right: 30px; top: 28px; }
    .b3 { width: 110px; height: 110px; background: #cbdcff; right: -42px; bottom: 30px; }
    .b4 { width: 34px; height: 34px; background: var(--pink); left: 40px; bottom: 38px; }

    .confetti {
      position: fixed;
      width: 10px;
      height: 16px;
      top: -20px;
      z-index: 999;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: .9;
      }
    }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>

  <main class="card">
    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>
    <div class="bubble b4"></div>

    <div class="eyebrow">IT Village PTY - Birthday Celebration ✨</div>
    <div class="cake">🎂</div>

    <h1>Happy Birthday,<br><span id="name">Andre</span>!</h1>
    <div class="date" id="birthday">2-Jan</div>

    <p class="message" id="message">
      Wishing you a day filled with great moments, lots of smiles, and plenty of reasons to celebrate. Hope this new year brings you exciting opportunities and amazing memories! 💙
    </p>

    <p class="from">
      With love,<br>
      <strong>Valued and Rewarded Pillar ✨</strong>
    </p>

    <button onclick="celebrate()">Celebrate 🎉</button>
  </main>

<script>
  const params = new URLSearchParams(window.location.search);

  const name = params.get("name") || "Fede";
  const birthday = params.get("birthday") || "2-Jan";

  const messages = [
    "Wishing you a day filled with great moments, lots of smiles, and plenty of reasons to celebrate. Hope this new year brings you exciting opportunities and amazing memories! 💙",
    "Hope your birthday is as wonderful as you are! Wishing you a year full of new adventures, great achievements, and many reasons to smile. 🎉",
    "Sending you lots of birthday wishes today! May this new year bring you happiness, exciting challenges, and plenty of unforgettable moments. ✨",
    "Cheers to another amazing year ahead! We hope your day is filled with good energy, great people, and everything that makes you happy. 🥳",
    "Happy Birthday! Wishing you a fantastic day and a year ahead full of growth, laughter, new experiences, and moments worth celebrating. 🎂",
    "Today is all about celebrating you! Hope you enjoy every moment and that the year ahead brings you great surprises and wonderful memories. 💫"
  ];

  function hashName(text) {
    let hash = 0;
    for (let i = 0; i < text.length; i++) {
      hash = ((hash << 5) - hash) + text.charCodeAt(i);
      hash |= 0;
    }
    return Math.abs(hash);
  }

  // Same person always receives the same generic message.
  const messageIndex = hashName(name) % messages.length;

  document.getElementById("name").textContent = name;
  document.getElementById("birthday").textContent = birthday;
  document.getElementById("message").textContent = messages[messageIndex];

  function celebrate() {
    const colors = ["#1546a0","#8cc8ff","#ffd66b","#ff9eb5","#7ed6a6","#8e7dff"];
    for (let i = 0; i < 90; i++) {
      const piece = document.createElement("div");
      piece.className = "confetti";
      piece.style.left = Math.random() * 100 + "vw";
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDuration = (2 + Math.random() * 3) + "s";
      piece.style.animationDelay = (Math.random() * .35) + "s";
      piece.style.borderRadius = Math.random() > .5 ? "50%" : "2px";
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 5500);
    }
  }

  window.addEventListener("load", () => setTimeout(celebrate, 500));
</script>

</body>
</html>
